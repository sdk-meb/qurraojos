stages:
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  VERCEL_CLI_TELEMETRY_DISABLED: "1"

deploy_staging_to_production:
  image: node:22
  stage: deploy
  interruptible: true
  resource_group: vercel-production
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.14.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm lint
    - pnpm add -g vercel@latest
    - test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is required" && exit 1)
    - test -n "$VERCEL_ORG_ID" || (echo "VERCEL_ORG_ID is required" && exit 1)
    - test -n "$VERCEL_PROJECT_ID" || (echo "VERCEL_PROJECT_ID is required" && exit 1)
    - |
      case "$VERCEL_ORG_ID" in
        *[!A-Za-z0-9_-]*|'') echo "VERCEL_ORG_ID has an invalid format"; exit 1 ;;
      esac
      case "$VERCEL_PROJECT_ID" in
        *[!A-Za-z0-9_-]*|'') echo "VERCEL_PROJECT_ID has an invalid format"; exit 1 ;;
      esac
      mkdir -p .vercel
      printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
  script:
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
    - vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
    - vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" -m gitlabDeployment=1 -m "gitlabCommitRef=$CI_COMMIT_BRANCH"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      changes:
        paths:
          - src/*
          - src/**/*
          - supabase/*
          - supabase/**/*
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - next.config.mjs
          - postcss.config.mjs
          - tailwind.config.ts
          - tsconfig.json
          - .gitlab-ci.yml
      when: always
    - when: never
  environment:
    name: production
    url: https://qurraojos.vercel.app
